# CI (ledger I0): the checks that used to run only when someone remembered to run them.
#   verify      hermetic: typecheck, plane-lint, unit tests, full build, lint, and the replay gate
#               (recorded histories against the candidate interpreter, ADR-029; any nondeterminism fails)
#   integration live PG (RLS itests + the schema/DB drift check, I1), Redis, and a Temporal dev server.
#               Runs `pnpm test:itest` twice (idempotency and replay bugs hide behind clean state), the
#               three no-LLM e2es (missed-call workflow, signed webhook, admin API), and the three agent e2es
#               against `pnpm mock-llm`, a scripted OpenAI-compatible model. A real model is still a
#               manual run: point LLM_BASE_URL at it (see README "LLM configuration").
# Service ports mirror infra/docker-compose.yml (PG 5433, Redis 6380) so the config dev defaults just work.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build FIRST: vitest resolves cross-package @hermes-one/* imports to each package's dist
      # (verification-discipline), so unit tests on a fresh clone need dist to exist.
      - run: pnpm -r build
      - run: pnpm verify # typecheck + plane-lint + unit tests
      - run: pnpm lint # eslint + prettier
      # Replay gate (ADR-029): every committed golden history must
      # replay against THIS build's interpreter with zero nondeterminism. Hard blocker, no waiver.
      - run: pnpm -F @hermes-one/workflow-worker replay-gate

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hermes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start Temporal dev server
        uses: temporalio/setup-temporal@v0
      - run: temporal server start-dev --headless --port 7233 &
      - name: Wait for Temporal
        run: |
          for i in $(seq 1 30); do
            temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Temporal dev server did not become healthy" >&2
          exit 1

      - run: pnpm -r build

      - name: Integration tests (live PG/Redis, run 1)
        run: pnpm test:itest
      - name: Integration tests (re-run — replay/idempotency discipline)
        run: pnpm test:itest

      - name: E2E missed-call workflow (real Temporal, no LLM)
        run: node apps/workflow-worker/dist/e2e.js
      - name: E2E signed webhook → workflow (real Temporal, no LLM)
        run: node apps/api-gateway/dist/e2e.js
      - name: E2E admin API surface and API-key auth (no LLM)
        run: node apps/admin-api/dist/e2e.js

      - name: Start the mock LLM
        run: |
          pnpm mock-llm > mock-llm.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4010/v1/models >/dev/null && exit 0
            sleep 1
          done
          cat mock-llm.log
          exit 1
      - name: Agent e2es against the mock LLM
        env:
          LLM_BASE_URL: http://127.0.0.1:4010/v1
          LLM_MODEL: mock
          LLM_API_KEY: mock
        run: |
          export HERMES_CREDENTIALS_MASTER_KEY=$(openssl rand -hex 32)
          node apps/agent-worker/dist/e2e.js
          node apps/agent-worker/dist/support-pack.e2e.js
          node apps/agent-worker/dist/pack-e.e2e.js
