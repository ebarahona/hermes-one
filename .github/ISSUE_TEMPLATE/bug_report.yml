name: Bug report
description: Something behaves differently than documented.
title: 'bug: '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Security issues: do not file here. Report them privately as described in SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the repository does this bug affect?
      options:
        - apps (services and workers)
        - components
        - infrastructure (adapters)
        - packages (contracts, DSLs, SDK, CLI)
        - verticals (packs)
        - docs
        - other (describe below)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, including error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Do not include API keys or other credentials.
      placeholder: |
        - hermes-one commit:
        - Node / pnpm:
        - OS:
        - LLM endpoint (if relevant, e.g. OpenAI, Ollama, llama.cpp):
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: Full output, if available. Remove any secrets first.
      render: text
    validations:
      required: false
