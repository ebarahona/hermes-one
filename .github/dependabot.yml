version: 2
updates:
  # One entry covers the whole pnpm workspace (root pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'Etc/UTC'
    # 0 turns off routine version bumps. Security updates (vulnerable deps) still open PRs.
    open-pull-requests-limit: 0
    versioning-strategy: increase-if-necessary
    ignore:
      # Node types should match the oldest supported Node (engines >=22.13), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      eslint:
        patterns:
          - 'eslint'
          - '@typescript-eslint/*'
          - 'eslint-*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      commitlint:
        patterns:
          - '@commitlint/*'
      loopback:
        patterns:
          - '@loopback/*'
      agentback:
        patterns:
          - '@agentback/*'
      temporal:
        patterns:
          - '@temporalio/*'
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      types:
        patterns:
          - '@types/*'
      # Roll all security fixes into a single PR.
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '06:00'
      timezone: 'Etc/UTC'
    # 0 turns off routine action bumps. Security updates still open PRs.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
