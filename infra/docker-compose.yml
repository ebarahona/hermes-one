# hermes-one local backing services — one isolated stack (ADR-006/007/014/022).
# Everything is grouped under the `hermes-one` Docker project (name below) with
# hermes-one-* container names, a dedicated network, and named volumes, so it
# never collides with other projects. Host ports are deliberately non-default
# (Postgres 5433, Redis 6380, Temporal UI 8233) to sit beside your existing
# 5432/6379 instances.
#
#   docker compose -f infra/docker-compose.yml up -d
#   Temporal UI  http://localhost:8233   ·  gRPC 127.0.0.1:7233
#   Postgres     127.0.0.1:5433          ·  Redis 127.0.0.1:6380
#   Qdrant       http://localhost:6333  (reserved: knowledge retrieval is planned, nothing connects yet)
name: hermes-one

# Shared settings for the Hermes processes in the `app` profile (bottom of this file).
x-hermes-app: &hermes-app
  build:
    context: ..
  image: hermes-one:local
  profiles: ['app']
  restart: unless-stopped
  env_file: ['quickstart.env']
  environment:
    TEMPORAL_ADDRESS: temporal:7233
    HERMES_AUTHORITATIVE_URL: postgres://hermes:hermes@postgres:5432/hermes
    HERMES_EPHEMERAL_URL: redis://redis:6379
    HERMES_VECTOR_URL: http://qdrant:6333
    HERMES_ADMIN_API_HOST: 0.0.0.0
    HERMES_GATEWAY_HOST: 0.0.0.0
    LLM_BASE_URL: ${LLM_BASE_URL:-http://mock-llm:4010/v1}
    LLM_MODEL: ${LLM_MODEL:-mock}
    LLM_API_KEY: ${LLM_API_KEY:-mock}

services:
  # --- Temporal (durable orchestration) + its own private Postgres ----------
  temporal-db:
    image: postgres:16-alpine
    container_name: hermes-one-temporal-db
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    # no host port — reachable only by the temporal service on the internal net

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: hermes-one-temporal
    depends_on:
      - temporal-db
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    ports:
      - '7233:7233'
    healthcheck:
      test: ['CMD', 'tctl', '--address', 'temporal:7233', 'cluster', 'health']
      interval: 10s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.52.0
    container_name: hermes-one-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - '8233:8080'

  # --- Platform authoritative store (Postgres, ADR-022) ---------------------
  postgres:
    image: postgres:16-alpine
    container_name: hermes-one-postgres
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hermes']
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Ephemeral lanes (Redis: cache/idempotency/locks/debounce, ADR-006) ---
  redis:
    image: redis:7-alpine
    container_name: hermes-one-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Vectors (Qdrant, ADR-007) --------------------------------------------
  # Reserved for knowledge retrieval, which is on the roadmap: no component connects to it yet.
  # Skip it with `docker compose ... up -d temporal-db temporal temporal-ui postgres redis otel-collector`.
  qdrant:
    image: qdrant/qdrant:v1.18
    container_name: hermes-one-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - '6333:6333'
      - '6334:6334'

  # --- Traces (OpenTelemetry Collector, OB5) ------
  # The OTLP/HTTP sink the workers export to when HERMES_OTEL_TRACES=otlp (endpoint
  # http://127.0.0.1:4318/v1/traces). The bundled config just logs received spans (debug exporter);
  # point its pipeline at Jaeger/Tempo in a real deployment (backend is deployment-pluggable).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: hermes-one-otel-collector
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP

  # --- Hermes itself (profile `app`) -----------------------------------------
  # Every Hermes process from one image (the repo Dockerfile), wired to the services above:
  #
  #   docker compose -f infra/docker-compose.yml --profile app up -d --build
  #
  # Admin API http://127.0.0.1:3001 · webhook ingress http://127.0.0.1:3002/webhooks/sms. The agent
  # worker talks to the scripted mock model unless LLM_BASE_URL/LLM_MODEL/LLM_API_KEY are set (they
  # must be reachable from inside the container). Demo tenant, admin key, and webhook secret:
  # infra/quickstart.env.
  migrate:
    <<: *hermes-app
    container_name: hermes-one-migrate
    command: ['node', 'apps/admin-api/dist/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  admin-api:
    <<: *hermes-app
    container_name: hermes-one-admin-api
    command: ['node', 'apps/admin-api/dist/main.js']
    ports:
      - '127.0.0.1:3001:3001'
    depends_on: &hermes-depends
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    <<: *hermes-app
    container_name: hermes-one-api-gateway
    command: ['node', 'apps/api-gateway/dist/main.js']
    ports:
      - '127.0.0.1:3002:3002'
    depends_on: *hermes-depends

  workflow-worker:
    <<: *hermes-app
    container_name: hermes-one-workflow-worker
    command: ['node', 'apps/workflow-worker/dist/worker.js']
    depends_on: *hermes-depends

  activity-worker:
    <<: *hermes-app
    container_name: hermes-one-activity-worker
    command: ['node', 'apps/activity-worker/dist/worker.js']
    depends_on: *hermes-depends

  agent-worker:
    <<: *hermes-app
    container_name: hermes-one-agent-worker
    command: ['node', 'apps/agent-worker/dist/worker.js']
    depends_on: *hermes-depends

  mock-llm:
    <<: *hermes-app
    container_name: hermes-one-mock-llm
    command: ['node_modules/.bin/tsx', 'tools/mock-llm.ts']
    environment:
      MOCK_LLM_HOST: 0.0.0.0
    env_file: []
    depends_on: []

volumes:
  temporal-db-data:
  postgres-data:
  redis-data:
  qdrant-data:
