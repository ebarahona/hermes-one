# hermes-one local backing services — one isolated stack (ADR-006/007/014/022).
# Everything is grouped under the `hermes-one` Docker project (name below) with
# hermes-one-* container names, a dedicated network, and named volumes, so it
# never collides with other projects. Host ports are deliberately non-default
# (Postgres 5433, Redis 6380, Temporal UI 8233) to sit beside your existing
# 5432/6379 instances.
#
#   docker compose -f infra/docker-compose.yml up -d
#   Temporal UI  http://localhost:8233   ·  gRPC 127.0.0.1:7233
#   Postgres     127.0.0.1:5433          ·  Redis 127.0.0.1:6380
#   Qdrant       http://localhost:6333
name: hermes-one

services:
  # --- Temporal (durable orchestration) + its own private Postgres ----------
  temporal-db:
    image: postgres:16-alpine
    container_name: hermes-one-temporal-db
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    # no host port — reachable only by the temporal service on the internal net

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: hermes-one-temporal
    depends_on:
      - temporal-db
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    ports:
      - '7233:7233'
    healthcheck:
      test: ['CMD', 'tctl', '--address', 'temporal:7233', 'cluster', 'health']
      interval: 10s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.52.0
    container_name: hermes-one-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - '8233:8080'

  # --- Platform authoritative store (Postgres, ADR-022) ---------------------
  postgres:
    image: postgres:16-alpine
    container_name: hermes-one-postgres
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hermes']
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Ephemeral lanes (Redis: cache/idempotency/locks/debounce, ADR-006) ---
  redis:
    image: redis:7-alpine
    container_name: hermes-one-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Vectors (Qdrant, ADR-007) --------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.18
    container_name: hermes-one-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - '6333:6333'
      - '6334:6334'

  # --- Traces (OpenTelemetry Collector, OB5) ------
  # The OTLP/HTTP sink the workers export to when HERMES_OTEL_TRACES=otlp (endpoint
  # http://127.0.0.1:4318/v1/traces). The bundled config just logs received spans (debug exporter);
  # point its pipeline at Jaeger/Tempo in a real deployment (backend is deployment-pluggable).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: hermes-one-otel-collector
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP

volumes:
  temporal-db-data:
  postgres-data:
  redis-data:
  qdrant-data:
