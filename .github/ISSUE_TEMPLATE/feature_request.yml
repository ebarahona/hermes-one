name: Feature request
description: Propose a capability, adapter, or vertical.
title: 'feat: '
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what's in the way? Describe the use case. Save the solution for the next field.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        How it should behave. For a new vertical, describe it as a pack (workflow, rules, policy,
        capabilities). For a new vendor, describe the provider adapter and the capability it
        implements.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you looked at, and why you passed on them.
    validations:
      required: false
  - type: checkboxes
    id: pr
    attributes:
      label: Willing to submit a PR
      options:
        - label: I am willing to submit a pull request for this change.
          required: false
