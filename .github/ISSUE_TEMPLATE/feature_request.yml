name: Feature request
description: Propose a capability, adapter, or vertical.
title: 'feat: '
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way? Describe the use case, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        How it should behave. If this is a new vertical, describe it as a pack (workflow, rules,
        policy, capabilities). If it is a new vendor, describe the provider adapter and the
        capability it realizes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated and why they were set aside.
    validations:
      required: false
  - type: checkboxes
    id: pr
    attributes:
      label: Willing to submit a PR
      options:
        - label: I am willing to submit a pull request for this change.
          required: false
